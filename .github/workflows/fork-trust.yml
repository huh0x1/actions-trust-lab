name: fork-trust-lab
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
permissions:
  contents: read
jobs:
  synthetic:
    if: github.event.label.name == 'run-safe-lab' || contains(github.event.pull_request.labels.*.name, 'run-safe-lab')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run synthetic fork fixture
        env:
          KIMI_SYNTHETIC_SECRET: ${{ secrets.KIMI_SYNTHETIC_SECRET }}
        run: python3 lab.py
