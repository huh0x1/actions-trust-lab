name: fork-trust-lab
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
permissions:
  contents: read
jobs:
  synthetic:
    if: github.event.label.name == 'run-safe-lab' || contains(github.event.pull_request.labels.*.name, 'run-safe-lab')
    runs-on: ubuntu-latest
    environment: synthetic-review
    steps:
      - name: Clone and run synthetic fork fixture
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KIMI_SYNTHETIC_SECRET: ${{ secrets.KIMI_SYNTHETIC_SECRET }}
        run: |
          git clone --no-checkout "https://github.com/${HEAD_REPO}.git" fork-src
          cd fork-src
          git checkout "$HEAD_SHA"
          python3 lab.py
