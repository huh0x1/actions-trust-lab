name: artifact-producer-lab
on: [pull_request]
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p artifact
          printf 'KIMI_BASE_ARTIFACT\n' > artifact/data.txt
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-artifact
          path: artifact/
          retention-days: 1
