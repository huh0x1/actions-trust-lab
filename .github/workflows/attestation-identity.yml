name: attestation-identity-lab
on: [workflow_dispatch]
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: printf 'KIMI_SIGNED_SUBJECT_V1\n' > subject.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: subject.txt
      - name: Verify original subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify subject.txt --repo test-kimi/actions-trust-lab
      - name: Reject modified subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'KIMI_TAMPERED_SUBJECT\n' >> subject.txt
          if gh attestation verify subject.txt --repo test-kimi/actions-trust-lab; then
            echo 'KIMI_UNEXPECTED_TAMPER_ACCEPT'; exit 1
          else
            echo 'KIMI_TAMPER_REJECTED'
          fi
